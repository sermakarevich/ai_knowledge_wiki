[project]
name = "clio-sandbox"
version = "0.1.0"
description = "Sandbox implementation of Clio paper core ideas - privacy-preserving conversation analysis"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ipython"]
