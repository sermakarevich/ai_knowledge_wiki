[project]
name = "llm-blocks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.13",
  "transformers>=5.16",
  "tokenizers",
  "numpy",
  "matplotlib",
  "scikit-learn",
  "typer",
  "rich",
  "safetensors",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_blocks"]

[tool.pytest.ini_options]
markers = ["slow: needs a model download or > 30 s"]
