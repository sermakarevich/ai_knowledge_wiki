[project]
name = "neo4j-tutorial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_tutorial"]
