[project]
name = "graph-rag-tutorial"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pypdf>=4",
    "rich>=13",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.pytest.ini_options]
markers = ["slow: calls the remote LLM, can take up to a minute"]
