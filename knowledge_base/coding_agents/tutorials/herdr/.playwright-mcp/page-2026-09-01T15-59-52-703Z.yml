      - generic [ref=f5e125]:
        - generic [ref=f5e126]: "02"
        - generic [ref=f5e128]:
          - heading "Multiplexers persist terminals, not agents." [level=3] [ref=f5e129]
          - paragraph [ref=f5e130]: "tmux gave humans persistence, and Herdr keeps that whole inheritance: real PTYs, detach, SSH. What it adds is the part multiplexers never had: knowing which pane is an agent, whether it's blocked, and how to wait on it instead of polling it."
