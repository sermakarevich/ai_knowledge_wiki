        - heading [level=1] [ref=f5e27]:
          - text: Apps manage the herd. Herdr
          - emphasis [ref=f5e28]: runs
          - text: it.
        - paragraph [ref=f5e29]: "Most tools Herdr gets compared to are apps: a window you open to manage coding agents, and a window the work depends on. Herdr is a different kind of thing: a runtime. A server holds real terminals open on the machine, the agents live in those, and every UI, ours included, is just a client that attaches. Keep that split in mind and the matrix below mostly explains itself."
