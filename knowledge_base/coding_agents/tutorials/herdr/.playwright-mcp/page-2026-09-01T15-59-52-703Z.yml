      - generic [ref=f5e147]:
        - generic [ref=f5e148]: "04"
        - generic [ref=f5e150]:
          - heading "Manager apps are clients without a runtime." [level=3] [ref=f5e151]
          - paragraph [ref=f5e152]: "Conductor, Emdash and Superset manage a herd from a window: worktrees, diffs, review queues. Useful, and Herdr pairs fine with that flow. But a window that manages agents is not a place agents live: quit the app and the herd goes with it."
