        - generic [ref=f5e161]: "05"
        - generic [ref=f5e163]:
          - heading "Dashboards watch processes." [level=3] [ref=f5e164]
          - paragraph [ref=f5e165]: "Solo supervises a dev stack: health, restarts, logs. Herdr's job is different: interactive agent terminals that stay open, hold scrollback and state, and stay yours whether or not anything is watching them."
