      - generic [ref=f5e136]:
        - generic [ref=f5e137]: "03"
        - generic [ref=f5e139]:
          - heading "Terminal apps replace your terminal." [level=3] [ref=f5e140]
          - paragraph [ref=f5e141]: cmux and Warp can be genuinely polished, but the deal is that the work moves into their window, with their renderer, on the machines they support. Herdr changes nothing about your terminal. It runs inside it, wherever a terminal and SSH already reach.
