    - generic [ref=f5e173]:
      - generic [ref=f5e174]: one-liners, for deciding fast
      - generic [ref=f5e176]:
        - article [ref=f5e177]:
          - generic [ref=f5e178]: herdr vs tmux
          - paragraph [ref=f5e179]: tmux keeps terminals alive; so does Herdr. The difference is Herdr knows which terminals are agents, what state each one is in, and how to wait on them. tmux sees panes.
        - article [ref=f5e180]:
          - generic [ref=f5e181]: herdr vs zellij
          - paragraph [ref=f5e182]: "Zellij is a friendlier workspace for humans in terminals. Herdr is a runtime for agents in terminals: state, waits, direct attach, and an API."
        - article [ref=f5e183]:
          - generic [ref=f5e184]: herdr vs cmux
          - paragraph [ref=f5e185]: "cmux is a Mac terminal app built around agents. Herdr isn't an app: it's the runtime underneath, in whatever terminal you already use, reachable over SSH."
        - article [ref=f5e186]:
          - generic [ref=f5e187]: herdr vs warp
          - paragraph [ref=f5e188]: Warp wants to be your terminal and your platform. Herdr keeps your terminal and owns what runs inside it.
        - article [ref=f5e189]:
          - generic [ref=f5e190]: herdr vs opencode web
          - paragraph [ref=f5e191]: "opencode's web mode serves one agent over HTTP. Herdr runs the whole herd: any agent CLI, many at once, from any tty."
        - article [ref=f5e192]:
          - generic [ref=f5e193]: herdr vs solo
          - paragraph [ref=f5e194]: Solo is a dashboard that supervises your dev processes. Herdr holds interactive agent terminals open whether or not anything is watching them.
        - article [ref=f5e195]:
          - generic [ref=f5e196]: herdr vs conductor, emdash, superset
          - paragraph [ref=f5e197]: "Manager apps put worktrees, diffs and review queues in a window. Herdr is the layer under that kind of window: quit their app and the agents stop; detach every Herdr client and they don't."
    - generic [ref=f5e200]:
      - heading "A runtime, not another window." [level=2] [ref=f5e201]
      - paragraph [ref=f5e202]: "Install it and nothing about your setup changes: same terminal, same agent CLIs. They just stop dying when a window does."
