      - paragraph [ref=f5e111]: "The columns are categories, not enemies: Herdr pairs happily with a worktree manager and runs fine inside a fancy terminal. The row that sorts the field is the second one: what happens to the agents when the thing you're looking at goes away."
    - generic [ref=f5e112]:
      - generic [ref=f5e113]:
        - generic [ref=f5e114]: "01"
        - generic [ref=f5e116]:
          - heading "Herdr is the runtime." [level=3] [ref=f5e117]
          - paragraph [ref=f5e118]: A server owns the terminals; every UI is a client of it. The TUI in the screenshots attaches, detaches and even crashes without the agents noticing. Same for the CLI, plain SSH, and whatever attaches next. The TUI is the first client, not the last.
