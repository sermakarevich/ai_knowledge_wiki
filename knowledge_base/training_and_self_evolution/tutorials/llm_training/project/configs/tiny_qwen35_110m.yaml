# Our from-scratch model: the Qwen3.5/3.8 hybrid architecture, shrunk to ~110M parameters.
# 12 layers in the 3 linear-attention : 1 full-attention pattern (full_attention_interval 4).
model:
  arch: qwen3_5            # Qwen3_5TextConfig
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 2
  head_dim: 64
  linear_num_value_heads: 12
  linear_num_key_heads: 6
  linear_key_head_dim: 64
  linear_value_head_dim: 64
  full_attention_interval: 4
  tie_word_embeddings: true
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-6
