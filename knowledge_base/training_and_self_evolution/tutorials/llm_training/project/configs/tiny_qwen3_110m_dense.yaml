# Fallback for machines where the Gated DeltaNet (linear attention) kernels are unavailable:
# the same size in the plain dense-attention Qwen3 architecture. Every layer is full attention.
model:
  arch: qwen3              # Qwen3Config
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 2
  head_dim: 64
  tie_word_embeddings: true
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-6
