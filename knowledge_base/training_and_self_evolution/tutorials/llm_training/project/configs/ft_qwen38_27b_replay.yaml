# Chapter 10 — the capstone applied: the winning forgetting mitigation on Qwen3.8-27B.
#
# Identical to `configs/ft_qwen38_27b_qlora.yaml` (chapter 09) in every respect except one line:
# `data.replay`. That is the point. The 4B grid in `runs/forget/summary.json` says replay is the
# single change that buys the most general ability back, so the only honest way to test it at 27B
# is to change nothing else — same base, same quantisation, same rank, same lr, same schedule,
# same sequence length, same seed. Any difference in the numbers is then attributable to replay.
#
# The DOSE, however, is deliberately not the 4B's winner. `forget.report`'s pre-registered rule
# picks `replay_10000` (general_mean 0.6442, +6.6 pts) and that is the adapter exported to Ollama.
# This 27B run uses 2,500 for cost: at 27B a replay step costs ~2.5x a domain step, so 10,000 rows
# would turn a ~1.5 h run into a ~4.5 h one, and the 4B grid shows 2,500 already captures 72 % of
# the general gain (+4.8 of +6.6) while scoring the BEST domain accuracy in the table (0.924).
# The chapter states this substitution rather than hiding it.
#
# Cost note: replay rows are far longer than a CyberMetric row, and `max_len: 512` truncates them,
# so each replay step costs ~2.5x a domain step rather than 8x. Expect ~2.5 h of training, versus
# 83.7 min for the domain-only run of chapter 09.
run_name: forget/qwen38_27b_replay
base: Qwen/Qwen3.8-27B
quant: nf4
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: attention+mlp
  modules_to_save: []
data:
  train_file: runs/data/cybermetric/train_dedup.json
  format: mcq_chat
  n_train: null
  replay: {dataset: HuggingFaceTB/smoltalk, subsets: [smol-magpie-ultra], n: 2500}
max_len: 512
epochs: 1
lr: 1.0e-4
schedule: cosine
warmup_ratio: 0.03
per_device_batch: 1
grad_accum: 8
bf16: true
gradient_checkpointing: true
liger: true
eval:
  domain_split: "2000"        # same split chapter 09 used for the 27B, so the two are comparable
  general: true               # in 4-bit this resolves to gsm8k + ifeval; eval_general.py skips
                              # the five loglikelihood tasks automatically, which is exactly the
                              # pair the 27B baseline in runs/eval_baselines/qwen3.8_27b measured
  general_config: configs/eval_general_4b.yaml
  load_in_4bit: true
seed: 1337
