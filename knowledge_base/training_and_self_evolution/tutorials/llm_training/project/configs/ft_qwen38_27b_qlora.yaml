# Chapter 09 — the capstone: QLoRA on Qwen3.8-27B inside one 24 GB RTX 4090.
#
# The base weights are quantised to 4-bit NF4 (bitsandbytes) and stay frozen; only the bf16 LoRA
# adapters are trained. Compared with Unsloth's published 24 GB recipe (batch 1, grad-accum 4,
# seq 2048, lr 2e-4) we are deliberately more conservative on memory: half the sequence length
# and twice the accumulation, so the effective batch is the same 8 sequences per optimizer step.
#
# target_modules is the explicit attention+MLP list rather than `all-linear`: on a 27B hybrid
# model the extra Gated DeltaNet projections would add adapters (and activations) we cannot
# afford, and the attention+MLP set is the recipe the QLoRA literature actually validated.
run_name: ft_qwen38_27b_qlora
base: Qwen/Qwen3.8-27B
quant: nf4
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: attention+mlp
  modules_to_save: []
data:
  train_file: runs/data/cybermetric/train_dedup.json
  format: mcq_chat
  n_train: null
  replay: {dataset: null, n: 0}
max_len: 512                 # 1024 OOMs on a 24 GB card at the loss step; see the chapter
epochs: 1
lr: 1.0e-4
schedule: cosine
warmup_ratio: 0.03
per_device_batch: 1
grad_accum: 8
bf16: true
gradient_checkpointing: true
liger: true                  # the 248k-token vocabulary makes the fused linear+CE kernel the difference between fitting and not
eval:
  domain_split: "2000"
  general: false          # the loglikelihood half of the suite needs a bf16 forward pass;
                          # see the chapter for what we run against the 4-bit model instead
  general_config: configs/eval_general_4b.yaml
  load_in_4bit: true
seed: 1337
