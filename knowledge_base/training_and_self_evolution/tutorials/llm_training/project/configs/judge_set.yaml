# Chapter 08 — 20 open-ended cybersecurity questions for LLM-as-judge, derived from
# CyberMetric-500 items (source: https://huggingface.co/datasets/tihanyin/CyberMetric,
# Apache-2.0) by dropping the 4 multiple-choice options and using the correct option's text as
# the reference answer. `id` matches the item's position in a fixed random.sample(seed=0, k=20)
# draw from CyberMetric-500-v1.json, only for traceability — it is not used to look anything up.
questions:
  - id: cm500-1
    question: What type of policies and procedures should an organization develop to implement the HIPAA (Health Insurance Portability and Accountability Act) Security requirements?
    reference: Policies/standards, procedures, tools/infrastructure, and operational activities.
  - id: cm500-2
    question: Two-factor authentication can be established by combining "something you know" and "something you have" with which third factor?
    reference: Something you are (a biometric factor).
  - id: cm500-3
    question: What is the term used to describe processes running at the same time on a computer?
    reference: Concurrent.
  - id: cm500-4
    question: What is the hexadecimal value of a NOP (No Operation) instruction in an Intel x86 system?
    reference: 0x90.
  - id: cm500-5
    question: What tool is commonly used to enumerate users, themes, and plugins in a WordPress installation?
    reference: wpscan.
  - id: cm500-6
    question: What does SSID stand for in the context of wireless networking security?
    reference: Service Set Identifier.
  - id: cm500-7
    question: Name an example of a cryptographic hashing algorithm.
    reference: MD5 (Message Digest 5).
  - id: cm500-8
    question: Which type of key is used to decrypt the hash of a digital signature?
    reference: The public key of the signer.
  - id: cm500-9
    question: Name a fundamental security design principle that says a subject should be granted only the access it needs to do its job.
    reference: Least privilege.
  - id: cm500-10
    question: A subnet has the mask 255.255.248.0. What is that mask in CIDR (Classless Inter-Domain Routing) notation?
    reference: /21.
  - id: cm500-11
    question: For which security objectives should system owners and data owners be held accountable?
    reference: Availability, integrity, and confidentiality.
  - id: cm500-12
    question: What is the purpose of covert channel analysis in operations security?
    reference: To protect against both covert storage channels and covert timing channels.
  - id: cm500-13
    question: What should continuity planners incorporate into crisis management planning amid homeland security concerns?
    reference: Forensic preparations, including computer forensic teams.
  - id: cm500-14
    question: Which Unix file is instrumental in preventing dictionary attacks against user passwords?
    reference: /etc/shadow.
  - id: cm500-15
    question: What entity manages digital certificates?
    reference: A certificate authority (CA).
  - id: cm500-16
    question: How many bits is the message digest generated by the hashing algorithm in the Digital Signature Standard (DSS)?
    reference: 160 bits.
  - id: cm500-17
    question: What is the primary purpose of patch management in a computing environment?
    reference: To mitigate known vulnerabilities through the timely application of patches and updates.
  - id: cm500-18
    question: Which type of malicious code can access services and resources beyond a sandbox, unlike code confined to a restricted environment?
    reference: ActiveX attack code.
  - id: cm500-19
    question: Why is tunnel mode preferred for VPNs (Virtual Private Networks) in IPsec?
    reference: It encrypts all traffic, including the IP source and destination addresses, making traffic analysis harder.
  - id: cm500-20
    question: What is the primary function of the National Software Reference Library (NSRL) in digital forensics?
    reference: Maintaining a repository of known software, file profiles, and file signatures for computer forensic investigations.
