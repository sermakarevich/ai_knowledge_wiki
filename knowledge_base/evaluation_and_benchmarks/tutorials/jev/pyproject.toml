[project]
name = "jev"
version = "0.1.0"
description = "Tutorial: TypeSafe Jev (System One model) from Python, with a fleet code-review example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pandas>=2.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
